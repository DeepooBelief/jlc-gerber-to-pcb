name: Release extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and project versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          extension_version="$(node -p "require('./extension.json').version")"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$extension_version"

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Create checksum
        shell: bash
        run: |
          asset="build/dist/gerber-to-pcb_${GITHUB_REF_NAME}.eext"
          test -f "$asset"
          cd "$(dirname "$asset")"
          sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/dist/gerber-to-pcb_${GITHUB_REF_NAME}.eext" \
            "build/dist/gerber-to-pcb_${GITHUB_REF_NAME}.eext.sha256" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
