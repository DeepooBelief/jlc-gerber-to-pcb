<!doctype html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Gerber 转 PCB · 导入进度</title>
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; padding: 24px; color: #172b4d; background: #f7f9fc; font: 14px/1.5 system-ui, sans-serif; }
			.heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
			h1 { margin: 0; font-size: 19px; }
			#percent { color: #1769df; font-size: 30px; font-weight: 700; }
			progress { display: block; width: 100%; height: 16px; margin: 12px 0 20px; accent-color: #1769df; }
			.label { color: #65758b; font-size: 12px; margin-bottom: 6px; }
			#detail { min-height: 88px; max-height: 120px; overflow: auto; padding: 12px; background: white; border: 1px solid #dce3ed; border-radius: 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
			.footer { display: flex; justify-content: space-between; margin-top: 14px; color: #65758b; font-size: 12px; }
			.note { margin-top: 12px; color: #65758b; font-size: 12px; }
		</style>
	</head>
	<body>
		<div class="heading"><h1>正在导入 Gerber</h1><span id="percent">—</span></div>
		<progress id="bar" max="100" aria-label="导入进度"></progress>
		<div class="label">当前文件 / 操作 / 处理数量</div>
		<div id="detail" role="status">正在连接导入任务…</div>
		<div class="footer"><span id="elapsed">已用时 0 秒</span><span id="connection">正在获取状态</span></div>
		<div class="note">百分比按处理数量推进，复杂铺铜可能停留较久。关闭或最小化此窗口不会取消导入。</div>
		<script>
			const topic = 'gerber-import-progress-snapshot';
			let lastState;
			let stopped = false;
			async function refresh() {
				if (stopped) return;
				try {
					const state = await eda.sys_MessageBus.rpcCall(topic, undefined, 2000);
					if (state && Number.isFinite(state.percent) && typeof state.detail === 'string') {
						lastState = state;
						document.getElementById('percent').textContent = `${Math.floor(state.percent)}%`;
						document.getElementById('bar').value = state.percent;
						document.getElementById('detail').textContent = state.detail;
						document.getElementById('connection').textContent = '已连接';
					}
				}
				catch {
					document.getElementById('connection').textContent = '等待任务响应…';
				}
				if (!stopped) setTimeout(refresh, 250);
			}
			const timer = setInterval(() => {
				if (lastState) {
					const seconds = Math.max(0, Math.floor((Date.now() - lastState.startedAt) / 1000));
					document.getElementById('elapsed').textContent = `已用时 ${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒`;
				}
			}, 1000);
			window.addEventListener('pagehide', () => { stopped = true; clearInterval(timer); });
			refresh();
		</script>
	</body>
</html>
